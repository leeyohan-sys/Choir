<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>성가대 파트 연습실</title>
    <link rel="stylesheet" href="./styles.css?v=20260831-11" />
  </head>
  <body>
    <main class="app">
      <h1>파트연습 찾기</h1>

      <section class="catalog-section catalog-section-first" aria-labelledby="easyGrace9Title">
        <h2 id="easyGrace9Title" class="catalog-title">The은혜론성가9</h2>
        <p class="catalog-desc">
          곡 제목 또는 유튜브 주소를 넣으면 빛나라 파트연습실 상세페이지로 이동합니다.
        </p>

        <form id="matchForm" class="card">
          <label for="youtubeUrl">곡 제목 또는 유튜브 주소</label>

          <div class="combo" id="combo">
            <div class="combo-input-row">
              <input
                id="youtubeUrl"
                name="youtubeUrl"
                type="text"
                placeholder="곡 제목 또는 유튜브 주소 입력"
                autocomplete="off"
                role="combobox"
                aria-expanded="false"
                aria-controls="songList"
                aria-autocomplete="list"
                required
              />
              <button id="comboToggle" type="button" class="combo-toggle" aria-label="곡 목록 열기">
                ▾
              </button>
            </div>
            <ul id="songList" class="combo-list" role="listbox" hidden></ul>
          </div>

          <button id="submitBtn" type="submit">파트연습 열기</button>
        </form>

        <p id="message" class="message" aria-live="polite"></p>

        <section id="resultBox" class="result-box" hidden>
          <p class="result-title">상세페이지 링크</p>
          <a id="resultLink" class="result-link" href="#" target="_blank" rel="noopener noreferrer"></a>
          <button id="copyBtn" type="button" class="copy-btn">링크 복사</button>
        </section>
      </section>

      <section class="catalog-section" aria-labelledby="easyGrace13Title">
        <h2 id="easyGrace13Title" class="catalog-title">쉽고 은혜로운 찬양곡집 13집</h2>
        <p class="catalog-desc">
          곡 번호 또는 곡 제목으로 찾으면 혼성/소프라노/알토/테너/베이스 파트연습 화면으로 이동합니다.
        </p>

        <form id="easyGrace13Form" class="card">
          <label for="easyGrace13Input">곡 번호 또는 곡 제목</label>

          <div class="combo" id="easyGrace13Combo">
            <div class="combo-input-row">
              <input
                id="easyGrace13Input"
                name="easyGrace13Input"
                type="text"
                placeholder="예: 6, 찬송하리로다"
                autocomplete="off"
                role="combobox"
                aria-expanded="false"
                aria-controls="easyGrace13SongList"
                aria-autocomplete="list"
                required
              />
              <button
                id="easyGrace13Toggle"
                type="button"
                class="combo-toggle"
                aria-label="쉽고 은혜로운 찬양곡집 13집 곡 목록 열기"
              >
                ▾
              </button>
            </div>
            <ul id="easyGrace13SongList" class="combo-list" role="listbox" hidden></ul>
          </div>

          <button id="easyGrace13Submit" type="submit">파트연습 열기</button>
        </form>

        <p id="easyGrace13Message" class="message" aria-live="polite"></p>

        <div id="easyGrace13PracticeBox" class="practice-parts" hidden></div>
      </section>
    </main>

    <script src="./part-practice-ui.js?v=20260831-13"></script>
    <script src="./main.js?v=20260831-13"></script>
  </body>
</html>
