<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Choir Part Match</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>파트연습 찾기</h1>
      <p class="desc">
        유튜브 주소 또는 곡 제목을 넣으면 빛나라 파트연습실 상세페이지로 이동합니다.
      </p>

      <form id="matchForm" class="card">
        <label for="youtubeUrl">유튜브 주소 또는 곡 제목</label>
        <input
          id="youtubeUrl"
          name="youtubeUrl"
          type="text"
          placeholder="유튜브 주소 또는 곡 제목 입력"
          required
        />
        <button id="submitBtn" type="submit">파트연습 열기</button>
      </form>

      <p id="message" class="message" aria-live="polite"></p>

      <section id="resultBox" class="result-box" hidden>
        <p class="result-title">상세페이지 링크</p>
        <a id="resultLink" class="result-link" href="#" target="_blank" rel="noopener noreferrer"></a>
        <button id="copyBtn" type="button" class="copy-btn">링크 복사</button>
      </section>
    </main>

    <script src="./main.js"></script>
  </body>
</html>
